<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Кристаллы три в ряд — Генератор уровней</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/brawl.css" />
    <style>
      body { overflow: auto; }
      .gen {
        max-width: 980px;
        margin: 24px auto;
        padding: 16px;
      }
      .gen h1 { font-size: 36px; font-family: Syne, sans-serif; }
      .gen .hint { font-weight: 700; opacity: 0.85; max-width: 62ch; }
      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px;
        margin: 16px 0;
      }
      .controls label { font-weight: 800; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
      .controls input, .controls select {
        border: 3px solid #111;
        border-radius: 12px;
        padding: 8px;
        font: 800 15px Nunito, sans-serif;
      }
      .preview {
        display: grid;
        gap: 3px;
        margin: 16px auto;
        width: max-content;
        background: #111;
        padding: 6px;
        border-radius: 12px;
      }
      .cell { width: 28px; height: 28px; border-radius: 6px; }
      .cell.on { background: #3c8cff; }
      .cell.off { background: #1a2040; }
      .cell.crate { background: #c4782a; }
      .cell.ice { background: #7ec8ff; }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        font-weight: 800;
        font-size: 13px;
        margin: 8px 0;
      }
      .legend span { display: inline-flex; align-items: center; gap: 6px; }
      .legend i {
        width: 14px; height: 14px; border-radius: 4px; display: inline-block;
      }
      textarea {
        width: 100%;
        min-height: 220px;
        border: 4px solid #111;
        border-radius: 16px;
        padding: 12px;
        font: 13px/1.4 ui-monospace, monospace;
        background: #0e1633;
        color: #e8f1ff;
      }
      .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    </style>
  </head>
  <body>
    <div class="gen">
      <a class="btn btn-red" href="index.html">К игре</a>
      <h1 class="title">Генератор уровней</h1>
      <p class="hint">
        Создаёт пак уровней для игры: 20 миров по 10 уровней (200 всего), поле до 9×9,
        ящики со 2-го мира, лёд с 3-го, волновая сложность с передышками и боссами.
        Готовый файл подставляется в игру как <code>levels/pack.json</code>.
      </p>
      <div class="controls">
        <label>Номер уровня <input id="id" type="number" value="1" min="1" max="200" /></label>
        <label>Столбцы <input id="cols" type="number" value="7" min="5" max="9" /></label>
        <label>Ряды <input id="rows" type="number" value="7" min="5" max="9" /></label>
        <label>Цвета самоцветов <input id="colors" type="number" value="4" min="4" max="6" /></label>
        <label>Ходы <input id="moves" type="number" value="30" min="8" max="40" /></label>
        <label>Форма поля
          <select id="shape">
            <option value="auto">Авто (по правилам)</option>
            <option value="full">Прямоугольник</option>
            <option value="diamond">Ромб</option>
            <option value="plus">Крест</option>
            <option value="ring">Кольцо</option>
            <option value="corners">Без углов</option>
            <option value="pyramid">Пирамида</option>
            <option value="hourglass">Песочные часы</option>
            <option value="stairs">Лестница</option>
            <option value="bridge">Мост</option>
          </select>
        </label>
        <label>Зерно случайности <input id="seed" type="number" value="20260824" /></label>
        <label>Сколько уровней <input id="count" type="number" value="200" min="1" max="300" /></label>
      </div>
      <div class="row">
        <button class="btn btn-blue" id="preview" type="button">Показать форму</button>
        <button class="btn btn-gold" id="one" type="button">Один уровень</button>
        <button class="btn btn-green" id="pack" type="button">Собрать пак</button>
        <button class="btn btn-red" id="download" type="button">Скачать файл</button>
      </div>
      <div class="legend">
        <span><i style="background:#3c8cff"></i> клетка</span>
        <span><i style="background:#c4782a"></i> ящик</span>
        <span><i style="background:#7ec8ff"></i> лёд</span>
        <span><i style="background:#1a2040"></i> пусто</span>
      </div>
      <div id="grid" class="preview"></div>
      <textarea id="out" spellcheck="false"></textarea>
    </div>
    <script src="js/generator.js"></script>
  </body>
</html>
