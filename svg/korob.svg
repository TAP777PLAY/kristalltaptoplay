<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="crGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff2a8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b4518" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0a060"/>
      <stop offset="35%" stop-color="#c07832"/>
      <stop offset="70%" stop-color="#8b4a18"/>
      <stop offset="100%" stop-color="#5c2e0e"/>
    </linearGradient>
    <linearGradient id="crWoodSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6a3512"/>
      <stop offset="40%" stop-color="#a86228"/>
      <stop offset="100%" stop-color="#4a2208"/>
    </linearGradient>
    <linearGradient id="crLid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0b870"/>
      <stop offset="55%" stop-color="#c88838"/>
      <stop offset="100%" stop-color="#8a5018"/>
    </linearGradient>
    <linearGradient id="crMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="40%" stop-color="#ffb020"/>
      <stop offset="100%" stop-color="#8a4a00"/>
    </linearGradient>
    <linearGradient id="crStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d49248"/>
      <stop offset="100%" stop-color="#2a1400"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="132" r="100" fill="url(#crGlow)"/>
  <!-- body -->
  <rect x="42" y="78" width="172" height="128" rx="14" fill="none" stroke="url(#crStroke)" stroke-width="10"/>
  <rect x="48" y="84" width="160" height="116" rx="10" fill="url(#crWood)"/>
  <!-- wood planks -->
  <line x1="48" y1="122" x2="208" y2="122" stroke="#5c2e0e" stroke-width="3" opacity="0.45"/>
  <line x1="48" y1="156" x2="208" y2="156" stroke="#5c2e0e" stroke-width="3" opacity="0.4"/>
  <line x1="98" y1="84" x2="98" y2="200" stroke="#6a3512" stroke-width="2.5" opacity="0.35"/>
  <line x1="158" y1="84" x2="158" y2="200" stroke="#6a3512" stroke-width="2.5" opacity="0.35"/>
  <!-- lid ridge -->
  <rect x="40" y="62" width="176" height="32" rx="10" fill="none" stroke="url(#crStroke)" stroke-width="9"/>
  <rect x="46" y="68" width="164" height="22" rx="7" fill="url(#crLid)"/>
  <path d="M 56 74 Q 128 66 200 74" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <!-- metal bands -->
  <rect x="48" y="108" width="160" height="14" fill="url(#crMetal)" stroke="url(#crStroke)" stroke-width="3"/>
  <rect x="48" y="172" width="160" height="14" fill="url(#crMetal)" stroke="url(#crStroke)" stroke-width="3"/>
  <!-- lock plate -->
  <rect x="108" y="128" width="40" height="36" rx="6" fill="url(#crMetal)" stroke="url(#crStroke)" stroke-width="4"/>
  <circle cx="128" cy="142" r="7" fill="#4a2208"/>
  <rect x="124" y="146" width="8" height="12" rx="2" fill="#4a2208"/>
  <!-- corner bolts -->
  <circle cx="62" cy="96" r="5" fill="url(#crMetal)" stroke="#4a2208" stroke-width="2"/>
  <circle cx="194" cy="96" r="5" fill="url(#crMetal)" stroke="#4a2208" stroke-width="2"/>
  <circle cx="62" cy="188" r="5" fill="url(#crMetal)" stroke="#4a2208" stroke-width="2"/>
  <circle cx="194" cy="188" r="5" fill="url(#crMetal)" stroke="#4a2208" stroke-width="2"/>
  <circle cx="68" cy="92" r="2" fill="#fff" opacity="0.7"/>
</svg>
