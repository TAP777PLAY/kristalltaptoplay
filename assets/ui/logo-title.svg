<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" role="img" aria-label="Кристаллы три в ряд. Соревнуйся с лучшими и займи место в рейтинге.">
  <defs>
    <linearGradient id="titleFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fce7ff"/>
      <stop offset="70%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="subFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="leadFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>
    <linearGradient id="banner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(40,18,72,.92)"/>
      <stop offset="100%" stop-color="rgba(16,8,36,.96)"/>
    </linearGradient>
  </defs>
  <g text-anchor="middle" font-family="Syne, system-ui, sans-serif">
    <text x="370" y="136" fill="url(#titleFill)" stroke="#fff7ff" stroke-width="4.5" paint-order="stroke fill" font-size="64" font-weight="800">Кристаллы</text>
    <text x="370" y="212" fill="url(#titleFill)" stroke="#fff7ff" stroke-width="4.2" paint-order="stroke fill" font-size="62" font-weight="800">три в ряд</text>
  </g>
  <g transform="translate(370 268)">
    <path d="M-210-36 L210-36 L232 0 L210 36 L-210 36 L-232 0 Z" fill="url(#banner)" stroke="rgba(232,120,255,.55)" stroke-width="1.8"/>
    <path d="M-190-22 L190-22" stroke="url(#subFill)" stroke-width="1.2" opacity=".4"/>
    <text x="0" y="-4" text-anchor="middle" fill="url(#leadFill)" font-family="Syne, system-ui, sans-serif" font-size="24" font-weight="700">Соревнуйся с лучшими</text>
    <text x="0" y="24" text-anchor="middle" fill="url(#leadFill)" font-family="Syne, system-ui, sans-serif" font-size="24" font-weight="700">и займи место в рейтинге</text>
  </g>
</svg>
