<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="rbGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#ff9ef8" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#5cc8ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#5cc8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rbCore" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#ffe8ff"/>
      <stop offset="45%" stop-color="#ff7ef0"/>
      <stop offset="70%" stop-color="#5cc8ff"/>
      <stop offset="100%" stop-color="#1a4aaa"/>
    </radialGradient>
    <linearGradient id="rbStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffe56a"/>
      <stop offset="70%" stop-color="#ff5ce8"/>
      <stop offset="100%" stop-color="#1c3d9a"/>
    </linearGradient>
    <linearGradient id="rbBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5a6a"/>
      <stop offset="20%" stop-color="#ffe14a"/>
      <stop offset="40%" stop-color="#7dff4a"/>
      <stop offset="60%" stop-color="#4db8ff"/>
      <stop offset="80%" stop-color="#ff5ce8"/>
      <stop offset="100%" stop-color="#ff5a6a"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="112" fill="url(#rbGlow)"/>
  <!-- outer ring -->
  <circle cx="128" cy="128" r="92" fill="none" stroke="url(#rbStroke)" stroke-width="12"/>
  <!-- main orb -->
  <circle cx="128" cy="128" r="86" fill="url(#rbCore)"/>
  <!-- rainbow equator band -->
  <path d="M 48 128 A 80 36 0 0 0 208 128 A 80 36 0 0 0 48 128"
        fill="none" stroke="url(#rbBand)" stroke-width="18" opacity="0.9"/>
  <path d="M 56 118 A 72 28 0 0 0 200 118"
        fill="none" stroke="#fff" stroke-width="4" opacity="0.35" stroke-linecap="round"/>
  <!-- star sparkles -->
  <g fill="#fff">
    <polygon points="128,46 134,62 152,62 138,72 144,90 128,80 112,90 118,72 104,62 122,62" opacity="0.95"/>
    <polygon points="188,78 192,88 204,88 194,95 198,106 188,100 178,106 182,95 172,88 184,88" opacity="0.85"/>
    <polygon points="72,168 75,176 84,176 77,181 80,190 72,185 64,190 67,181 60,176 69,176" opacity="0.8"/>
  </g>
  <!-- glossy highlight -->
  <ellipse cx="100" cy="96" rx="28" ry="16" fill="#fff" opacity="0.55" transform="rotate(-18 100 96)"/>
  <circle cx="148" cy="150" r="10" fill="#fff" opacity="0.2"/>
</svg>
